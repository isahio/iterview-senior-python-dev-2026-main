[project]
name = "ticket-triage-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.34",
    "click>=8.1",
    "agent-core",
]

[tool.uv.sources]
agent-core = { workspace = true }

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]