services:
  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MCP_SERVER_URL: http://mcp-server:8001
    depends_on:
      - mcp-server
